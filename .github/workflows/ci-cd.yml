name: CI/CD Pipeline - Test & Deploy to Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_api.py -v

  deploy:
    name: Trigger Render Production Deployment
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render via Secure Webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::Secret RENDER_DEPLOY_HOOK_URL is not yet configured. Skipping Render deploy hook trigger."
            echo "To enable automatic zero-downtime deploys on test pass, add RENDER_DEPLOY_HOOK_URL to GitHub Secrets."
            exit 0
          fi
          echo "Triggering deployment on Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Render deployment successfully triggered. Response: $BODY"
          else
            echo "::error::Render deployment hook failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
